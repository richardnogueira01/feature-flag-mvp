openapi: 3.0.3
info:
  title: Feature Flag MVP API
  version: 0.1.0
  description: API mínima para administrar e avaliar feature flags.
servers:
  - url: http://localhost:8080
paths:
  /v1/flags:
    get:
      summary: Lista todas as flags
      responses:
        '200':
          description: Lista ordenada por key
          content: {application/json: {schema: {$ref: '#/components/schemas/FlagList'}}}
    post:
      summary: Cria uma flag
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FlagInput'}}}
      responses:
        '201': {description: Flag criada, content: {application/json: {schema: {$ref: '#/components/schemas/Flag'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/flags/{key}:
    parameters: [{name: key, in: path, required: true, schema: {type: string, maxLength: 128}}]
    get:
      summary: Consulta uma flag
      responses:
        '200': {description: Flag, content: {application/json: {schema: {$ref: '#/components/schemas/Flag'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: Atualiza uma flag
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FlagInput'}}}
      responses:
        '200': {description: Flag atualizada, content: {application/json: {schema: {$ref: '#/components/schemas/Flag'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Ativa ou desativa uma flag sem alterar seu value
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}
            example: {enabled: false}
      responses:
        '200': {description: Estado atualizado}
        '400': {description: enabled obrigatório}
        '404': {description: Flag não encontrada}
    delete:
      summary: Remove uma flag
      responses:
        '204': {description: Flag removida}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/applications:
    get:
      summary: Lista applications
      responses:
        '200': {description: Lista de applications, content: {application/json: {schema: {type: object, properties: {applications: {type: array, items: {$ref: '#/components/schemas/Application'}}}}}}}
    post:
      summary: Cria uma application
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NameInput'}}}
      responses:
        '201': {description: Application criada, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/applications/{application}/environments:
    parameters: [{name: application, in: path, required: true, schema: {type: string}}]
    get: {summary: Lista environments da application, responses: {'200': {description: Lista}, '404': {$ref: '#/components/responses/NotFound'}}}
    post:
      summary: Cria um environment
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NameInput'}}}}
      responses:
        '201': {description: Environment criado}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/applications/{application}/environments/{environment}/configurations:
    parameters:
      - {name: application, in: path, required: true, schema: {type: string}}
      - {name: environment, in: path, required: true, schema: {type: string}}
    get: {summary: Lista configurations do environment, responses: {'200': {description: Lista}, '404': {$ref: '#/components/responses/NotFound'}}}
    post:
      summary: Cria uma configuration
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NameInput'}}}}
      responses:
        '201': {description: Configuration criada}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/applications/{application}/environments/{environment}/configurations/{configuration}:
    parameters:
      - {name: application, in: path, required: true, schema: {type: string}}
      - {name: environment, in: path, required: true, schema: {type: string}}
      - {name: configuration, in: path, required: true, schema: {type: string}}
    get:
      summary: Snapshot da configuration (todas as flags, revision, ETag/304)
      responses:
        '200': {description: Snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/ConfigurationSnapshot'}}}}
        '304': {description: Não modificado (If-None-Match)}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/applications/{application}/environments/{environment}/configurations/{configuration}/flags:
    parameters:
      - {name: application, in: path, required: true, schema: {type: string}}
      - {name: environment, in: path, required: true, schema: {type: string}}
      - {name: configuration, in: path, required: true, schema: {type: string}}
    get: {summary: Lista flags da configuration, responses: {'200': {description: Lista}, '404': {$ref: '#/components/responses/NotFound'}}}
    post:
      summary: Cria uma flag na configuration
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FlagInput'}}}}
      responses:
        '201': {description: Flag criada, content: {application/json: {schema: {$ref: '#/components/schemas/ScopedFlag'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/applications/{application}/environments/{environment}/configurations/{configuration}/flags/{key}:
    parameters:
      - {name: application, in: path, required: true, schema: {type: string}}
      - {name: environment, in: path, required: true, schema: {type: string}}
      - {name: configuration, in: path, required: true, schema: {type: string}}
      - {name: key, in: path, required: true, schema: {type: string, maxLength: 128}}
    get: {summary: Consulta uma flag, responses: {'200': {description: Flag}, '404': {$ref: '#/components/responses/NotFound'}}}
    put:
      summary: Atualiza uma flag existente
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FlagInput'}}}}
      responses: {'200': {description: Flag atualizada}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      summary: Ativa ou desativa a flag sem alterar seu value
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}}}
      responses: {'200': {description: Estado atualizado}, '404': {$ref: '#/components/responses/NotFound'}}
    delete:
      summary: Remove a flag
      responses: {'204': {description: Flag removida}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/evaluate/{key}:
    get:
      summary: Avalia uma flag no snapshot local
      parameters: [{name: key, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Resultado, content: {application/json: {schema: {$ref: '#/components/schemas/Evaluation'}}}}
        '404': {description: Flag inexistente}
  /healthz:
    get: {summary: Liveness, responses: {'200': {description: Processo ativo}}}
  /readyz:
    get: {summary: Readiness, responses: {'200': {description: Snapshot sincronizado}, '503': {description: Ainda não sincronizado}}}
  /internal/status:
    get: {summary: Status operacional, responses: {'200': {description: Status}}}
  /metrics:
    get: {summary: Métricas Prometheus, responses: {'200': {description: Métricas}}}
components:
  schemas:
    FlagInput: {type: object, required: [enabled], properties: {key: {type: string, maxLength: 128}, enabled: {type: boolean}}}
    Flag: {type: object, properties: {Key: {type: string}, Enabled: {type: boolean}, Revision: {type: integer, format: int64}}}
    FlagList: {type: object, properties: {flags: {type: array, items: {$ref: '#/components/schemas/Flag'}}}}
    Evaluation: {type: object, properties: {enabled: {type: boolean}, revision: {type: integer, format: int64}}}
    NameInput: {type: object, required: [name], properties: {name: {type: string, maxLength: 128}}}
    Application: {type: object, properties: {id: {type: integer, format: int64}, name: {type: string}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}
    Environment: {type: object, properties: {id: {type: integer, format: int64}, application_id: {type: integer, format: int64}, name: {type: string}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}
    Configuration: {type: object, properties: {id: {type: integer, format: int64}, environment_id: {type: integer, format: int64}, name: {type: string}, revision: {type: integer, format: int64}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}
    ScopedFlag: {type: object, properties: {key: {type: string}, enabled: {type: boolean}, value: {}, revision: {type: integer, format: int64}}}
    ConfigurationSnapshot:
      type: object
      properties:
        application: {type: string}
        environment: {type: string}
        configuration: {type: string}
        revision: {type: integer, format: int64}
        flags: {type: array, items: {$ref: '#/components/schemas/ScopedFlag'}}
    Error: {type: object, properties: {error: {type: string}}}
  responses:
    BadRequest: {description: Requisição inválida, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflito, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Não encontrado, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
